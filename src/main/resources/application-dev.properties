# Local development profile — run with:
#   .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=dev"
#
# Supplies defaults for everything application.properties requires from the
# environment, pointed at the local Docker Postgres (donorly-dev-pg2, port
# 15432). Real env vars still win if set. NEVER use this profile in the cloud:
# the JWT secret below is public by definition.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:15432}/${PGDATABASE:donorly}
spring.datasource.username=${PGUSER:donorly}
spring.datasource.password=${PGPASSWORD:donorly}

# Fixed dev-only signing key (Base64, 48 bytes). Fine locally; worthless as a secret.
jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWRldi1vbmx5LXNlY3JldC1kZXYtb25seS1zZWNyZXQh}

# Louder logs while developing.
spring.jpa.show-sql=false
logging.level.org.donorly=DEBUG

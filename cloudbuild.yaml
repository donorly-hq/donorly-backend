# Build + deploy for the backend. The substitutions below default to the DEV
# environment; the PROD Cloud Build trigger overrides them (service name,
# database, secrets, portal URL) so one file serves both environments.
substitutions:
  _REGION: us-central1
  _REPO: donorly
  _SERVICE: donorly-backend
  # Database (Railway Postgres) — PROD overrides _PGDATABASE (and password secret).
  _PGHOST: hayabusa.proxy.rlwy.net
  _PGPORT: "29331"
  _PGDATABASE: railway
  _PGUSER: postgres
  _DB_PASSWORD_SECRET: donorly-db-password
  _JWT_SECRET_NAME: donorly-jwt-secret
  # The portal this backend serves (used in emails and links).
  _APP_BASE_URL: https://donorly-portal-jyiyrqfy5q-uc.a.run.app
  _MIN_INSTANCES: "0"

steps:
  # Step 0: Build the Docker image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  # Step 1: Push commit-sha tag
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA

  # Step 2: Push latest tag
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

  # Step 3: Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=5
      - --set-env-vars=SPRING_PROFILES_ACTIVE=gcp
      - --set-secrets=JWT_SECRET=${_JWT_SECRET_NAME}:latest,PGPASSWORD=${_DB_PASSWORD_SECRET}:latest,MAIL_PASSWORD=donorly-mail-password:latest,OPENAI_API_KEY=donorly-openai-key:latest
      - --set-env-vars=PGHOST=${_PGHOST},PGPORT=${_PGPORT},PGDATABASE=${_PGDATABASE},PGUSER=${_PGUSER}
      - --set-env-vars=MAIL_USERNAME=sam@donorly.org,MAIL_FROM_NAME=Donorly,APP_BASE_URL=${_APP_BASE_URL}
      - --set-env-vars=DONORLY_GCS_BUCKET=donorly-app-501321-org-assets

options:
  logging: CLOUD_LOGGING_ONLY
